<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Task App</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="todo.css">
</head>
<body>

    <div class="todo-container">
        <h2>To-Do List</h2>
        
        <div class="stats">
            <p>Total: <span id="total-count">4</span></p>
            <p>Completed now: <span id="completed-count">0</span></p>
        </div>

        <div class="input-group">
            <input type="text" id="task-input" placeholder="New task...">
            <button onclick="addNewTask()">Add</button>
        </div>

        <ul id="task-list">
            <li>
                <div class="task-text" onclick="toggleTask(this)">
                    <i class="fa-regular fa-circle-check"></i> 
                    <span>wash clothes</span>
                </div>
                <button class="delete-btn" onclick="deleteTask(this)">
                    <i class="fa-solid fa-trash"></i></button>
            </li>
            <li>
                <div class="task-text" onclick="toggleTask(this)">
                    <i class="fa-regular fa-circle-check"></i> 
                    <span>iron clothes</span>
                </div>
                <button class="delete-btn" onclick="deleteTask(this)">
                    <i class="fa-solid fa-trash"></i></button>
            </li>
            <li>
                <div class="task-text" onclick="toggleTask(this)">
                    <i class="fa-regular fa-circle-check"></i> 
                    <span>cook</span>
                </div>
                <button class="delete-btn" onclick="deleteTask(this)">
                    <i class="fa-solid fa-trash"></i></button>
            </li>
            <li>
                <div class="task-text" onclick="toggleTask(this)">
                    <i class="fa-regular fa-circle-check"></i> 
                    <span>arrange the rooms</span>
                </div>
                <button class="delete-btn" onclick="deleteTask(this)">
                    <i class="fa-solid fa-trash"></i></button>
            </li>
        </ul>
    </div>

    <script src="todo.js"></script>
</body>
</html>
